name: site

on:
  push:
    branches: [main]
  pull_request:
    # Lean changes too: data/proofs.json copies proof text from the sources and npm test checks it for drift.
    paths: ["site/**", "OAI/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Validate explainer nodes and test the playground engine
        run: npm test
      - name: Check decls.json is in sync with decls.raw.json
        run: |
          python3 tools/build_decls.py
          git diff --exit-code data/decls.json || { echo "::error::data/decls.json is stale; run python3 site/tools/build_decls.py"; exit 1; }
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
